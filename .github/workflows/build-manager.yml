name: build-manager

# Rebuild the BakaSU / ReSukiSU manager so that it no longer matches the
# fingerprints Duck Detector uses for its "Root Managers" card, while keeping
# su, modules and SuSFS fully functional:
#   * applicationId: input-driven (default com.quietforest.systemservice);
#   * launcher label: input-driven (default "Baka");
#   * embedded ksud payload renamed libksud.so -> libsyshelper.so, with every
#     loader updated (KsuCli, AppZygotePreload, DynamicManagerRepository, jni.c);
#   * Application / zygote-preload / launcher classes renamed, the custom
#     Application replaced by a ContentProvider initialiser, and the LKM-only
#     `android:zygotePreloadName` attribute dropped;
#   * signing key kept stable, so the kernel dynamic-manager authorisation
#     (`ksud kernel dynamic-manager set-apk ...`, persisted in
#     /data/adb/ksu/.dynamic_manager) survives rebuilds and reboots.
#
# Notes:
#   * The kernel verifies APKs with its own v2-block parser: it rejects any v1
#     (META-INF/MANIFEST.MF) or v3 signature block. The Gradle plugin output is
#     therefore re-signed v2-only with apksigner from the runner's build-tools.
#   * The ksud binary is injected as libsyshelper.so because the kernel ships
#     uapi 6 while the manager's Gradle build does not bundle ksud; the binary is
#     taken from the installed 35286 manager (same upstream commit, uapi 6).
#   * The keystore in manager-repack/ is intentionally committed (personal
#     project). It must only ever be used for this manager. See its README.
#
# This workflow uses its own concurrency group on purpose. The kernel workflow
# (build.yml) is `cancel-in-progress: true`, so a push to main while a kernel
# build is running cancels that build - do not push during a kernel run, and do
# not reuse its concurrency group here.

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "applicationId of the repacked manager"
        required: true
        default: "com.quietforest.systemservice"
        type: string
      app_name:
        description: "launcher label (resValue app_name)"
        required: true
        default: "Baka"
        type: string
      upstream_ref:
        description: "BakaSU commit/tag; must match the kernel's KSU uapi (6 = cac1e793)"
        required: true
        default: "cac1e793"
        type: string

permissions:
  contents: read

concurrency:
  group: manager-repack
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/Baka-SU/BakaSU.git
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'cac1e793' }}
  KSU_PACKAGE_NAME: ${{ inputs.package_name || 'com.quietforest.systemservice' }}
  KSU_APP_NAME: ${{ inputs.app_name || 'Baka' }}
  # Stable signing key: committed at manager-repack/ksu-manager.jks (alias ksu-manager).
  # Personal project key - see manager-repack/README.md before touching it.
  KEYSTORE_PASSWORD: "n4bu-KSU-2026-7f3a9c5e"
  KEY_ALIAS: "ksu-manager"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone upstream manager source
        run: |
          set -euo pipefail
          git clone "$UPSTREAM_REPO" upstream
          git -C upstream checkout "$UPSTREAM_REF"
          git -C upstream log -1 --format='upstream HEAD: %H %s'
          echo "commit count: $(git -C upstream rev-list --count HEAD)"

      - name: Report versions that will be baked in
        run: |
          set -euo pipefail
          COUNT=$(git -C upstream rev-list --count HEAD)
          VCODE=$((30000 + COUNT + 700))
          VNAME=$(git -C upstream describe --tags --always --abbrev=0)
          echo "BakaSU version: $VNAME ($VCODE)"
          echo "Upstream commit count: $COUNT"
          echo "VERSION_CODE=$VCODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VNAME" >> "$GITHUB_ENV"

      - name: Inject stable keystore and ksud
        run: |
          set -euo pipefail
          cp manager-repack/ksu-manager.jks upstream/manager/key.jks
          mkdir -p upstream/manager/app/src/main/jniLibs/arm64-v8a
          cp manager-repack/libksud-arm64.so upstream/manager/app/src/main/jniLibs/arm64-v8a/libsyshelper.so
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> upstream/manager/gradle.properties
          ls -l upstream/manager/key.jks upstream/manager/app/src/main/jniLibs/arm64-v8a/libsyshelper.so

      - name: Rename embedded ksud payload
        run: |
          set -euo pipefail
          cd upstream/manager
          # libksud.so -> libsyshelper.so: keep every loader in sync.
          sed -i 's|getNativeLibraryPath("ksud")|getNativeLibraryPath("syshelper")|' \
            app/src/main/java/org/bakasu/bakasu/data/shell/KsuCli.kt
          sed -i 's|"libksud.so"|"libsyshelper.so"|g' \
            app/src/main/java/org/bakasu/bakasu/magica/AppZygotePreload.java \
            app/src/main/java/org/bakasu/bakasu/data/application/DynamicManagerRepository.kt
          sed -i 's|execl(path, "ksud",|execl(path, "syshelper",|' \
            app/src/main/cpp/jni.c
          echo "--- remaining libksud references (must be none) ---"
          grep -RIn 'libksud\.so\|getNativeLibraryPath("ksud")' app/src/main || echo "none"

      - name: Rename manager classes
        run: |
          set -euo pipefail
          cd upstream/manager
          base=app/src/main/java/org/bakasu/bakasu
          # Keep package path org.bakasu.bakasu; only rename the three classes the
          # detector fingerprints. Files/manifests/JNI symbol names must stay in sync.
          mv "$base/KernelSUApplication.kt" "$base/SystemApplication.kt"
          mv "$base/ui/MainActivity.kt" "$base/ui/SystemActivity.kt"
          mv "$base/magica/AppZygotePreload.java" "$base/magica/ZygoteLoader.java"
          grep -RIl 'KernelSUApplication' app/src/main | xargs -r sed -i 's/KernelSUApplication/SystemApplication/g' || true
          grep -RIl 'MainActivity' app/src/main | xargs -r sed -i 's/MainActivity/SystemActivity/g' || true
          grep -RIl 'AppZygotePreload' app/src/main | xargs -r sed -i 's/AppZygotePreload/ZygoteLoader/g' || true
          echo "--- leftover old class names (must be none) ---"
          grep -RIn 'KernelSUApplication\|AppZygotePreload\|MainActivity' app/src/main || echo "none"
          echo "--- manifest components ---"
          grep -nE 'android:name="\.(SystemApplication|ui\.SystemActivity)|zygotePreloadName|targetActivity' app/src/main/AndroidManifest.xml

      - name: Shrink class fingerprints
        run: |
          set -euo pipefail
          cd upstream/manager
          base=app/src/main/java/org/bakasu/bakasu
          # "Application" suffix itself is a fingerprint; use a short neutral name.
          mv "$base/SystemApplication.kt" "$base/Sys.kt"
          grep -RIl 'SystemApplication' app/src/main | xargs -r sed -i 's/SystemApplication/Sys/g' || true
          # Built-in kernel mode does not use the LKM app_zygote preload; dropping the
          # manifest attribute removes that anchor without touching su/modules.
          sed -i 's| android:zygotePreloadName="[^"]*"||' app/src/main/AndroidManifest.xml
          echo "--- application class ---"
          grep -n 'android:name="\.Sys"' app/src/main/AndroidManifest.xml
          echo "--- zygote preload (must be removed) ---"
          grep -n 'zygotePreloadName' app/src/main/AndroidManifest.xml || echo "removed"

      - name: Remove custom Application class
        run: |
          set -euo pipefail
          cd upstream/manager
          base=app/src/main/java/org/bakasu/bakasu
          # No Application subclass at all: its init moves to a ContentProvider,
          # which still runs before the first Activity.
          rm -f "$base/Sys.kt"
          cp "$GITHUB_WORKSPACE/manager-repack/AppInitProvider.kt" "$base/AppInitProvider.kt"
          python3 "$GITHUB_WORKSPACE/manager-repack/patch_manifest.py"
          echo "--- application tag (no android:name) ---"
          grep -n -A1 '<application' app/src/main/AndroidManifest.xml | head -5
          echo "--- init provider ---"
          grep -n 'AppInitProvider' app/src/main/AndroidManifest.xml
          echo "--- leftover Application classes (must be none) ---"
          grep -RIn 'class .*: Application()' app/src/main || echo "none"

      - name: Build release APK
        working-directory: upstream/manager
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PKSU_PACKAGE_NAME="$KSU_PACKAGE_NAME" \
            -PKSU_NAME="$KSU_APP_NAME" \
            --stacktrace
          echo "--- outputs ---"
          ls -l app/build/outputs/apk/release/

      - name: Re-sign v2-only (no v1, no v3)
        run: |
          set -euo pipefail
          cd upstream/manager
          APK=$(ls app/build/outputs/apk/release/*-arm64-v8a-release.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/release/*universal*release.apk | head -n1)
          fi
          echo "input APK: $APK"
          ls -l "$APK"

          BT=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n1)
          echo "build-tools: $BT"
          "$BT/zipalign" -c -p 4 "$APK" && echo "input APK is already aligned" || echo "input APK not aligned - re-aligning"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/in.apk"
          cd "$GITHUB_WORKSPACE/dist"

          # Drop any v1 (JAR) signature leftovers; the kernel rejects APKs that
          # contain META-INF/MANIFEST.MF.
          zip -d in.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true

          "$BT/zipalign" -f -p 4 in.apk aligned.apk
          OUT="ksu-manager_${KSU_PACKAGE_NAME}_${VERSION_CODE}.apk"
          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/manager-repack/ksu-manager.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$OUT" aligned.apk
          echo "OUT_APK=$GITHUB_WORKSPACE/dist/$OUT" >> "$GITHUB_ENV"
          echo "$OUT"

      - name: Verify signature scheme and contents
        run: |
          set -euo pipefail
          OUT="$OUT_APK"
          BT=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n1)

          echo "--- apksigner verify ---"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee verify.txt

          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v1 scheme (JAR signing): false" verify.txt
          if grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt; then
            echo "::error::v3 signature present - kernel parser would reject this APK"
            exit 1
          fi

          echo "--- v1 signature files (must be none) ---"
          if unzip -l "$OUT" | grep -q 'META-INF/MANIFEST.MF'; then
            echo "::error::META-INF/MANIFEST.MF present - kernel would reject this APK"
            exit 1
          fi
          echo "no META-INF/MANIFEST.MF"

          echo "--- native libs ---"
          unzip -l "$OUT" | grep -E 'lib/.+/(libsyshelper|libkernelsu)\.so'
          unzip -l "$OUT" | grep -q 'lib/arm64-v8a/libsyshelper.so'

          echo "--- certificate (this is what dynamic-manager must trust) ---"
          keytool -exportcert -alias "$KEY_ALIAS" \
            -keystore "$GITHUB_WORKSPACE/manager-repack/ksu-manager.jks" \
            -storepass "$KEYSTORE_PASSWORD" -file cert.der
          SIZE=$(stat -c%s cert.der)
          HASH=$(sha256sum cert.der | cut -d' ' -f1)
          echo "cert size: 0x$(printf '%x' "$SIZE") ($SIZE bytes)"
          echo "cert sha256: $HASH"
          APK_SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "apk sha256: $APK_SHA"
          echo "apk bytes: $(stat -c%s "$OUT")"
          {
            echo "### Manager APK"
            echo ""
            echo "- applicationId: \`$KSU_PACKAGE_NAME\`"
            echo "- app label: \`$KSU_APP_NAME\`"
            echo "- version: \`$VERSION_NAME ($VERSION_CODE)\`"
            echo "- upstream: \`$UPSTREAM_REF\`"
            echo "- APK: \`$(basename "$OUT")\` ($(stat -c%s "$OUT") bytes)"
            echo "- APK sha256: \`$APK_SHA\`"
            echo "- signing cert size: \`0x$(printf '%x' "$SIZE")\` ($SIZE bytes)"
            echo "- signing cert sha256: \`$HASH\`"
            echo "- dynamic manager command: \`su -c '/data/adb/ksu/bin/ksud kernel dynamic-manager set-apk <apk>'\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manager-${{ env.KSU_PACKAGE_NAME }}-${{ github.run_number }}
          path: dist/ksu-manager_*.apk
          retention-days: 30
          if-no-files-found: error
